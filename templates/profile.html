{% extends "base.html" %}
{% block content %}
<h2>Profile</h2>

<p><b>Email:</b> {{ user["email"] }}</p>
<p><b>Role:</b> {{ user["role"] }}</p>
<p><b>Created:</b> {{ user["created_at"] }}</p>
<p><b>Locked:</b> {{ "Yes" if user["locked"] else "No" }}</p>

<p style="margin-top:20px;">
  <a href="{{ url_for('tickets') }}">Manage tickets</a>
</p>
{% endblock %}
